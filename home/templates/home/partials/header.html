{% load static %}
<header class="border-b border-border">
    <div class="mx-auto flex max-w-4xl items-center justify-between p-6">
        <a href="{% url 'home:index' %}" aria-label="Detonado — início">
            <img src="{% static 'img/logo.jpeg' %}" alt="Detonado" class="h-7 w-auto">
        </a>
        <nav aria-label="Navegação principal">
            <ul class="flex gap-4">
                <li>
                    <a href="{% url 'home:index' %}"
                       class="{% if request.resolver_match.namespace == 'home' %}font-medium text-primary{% else %}text-muted-foreground hover:text-foreground{% endif %}"
                       {% if request.resolver_match.namespace == 'home' %}aria-current="page"{% endif %}>
                        Início
                    </a>
                </li>
                <li>
                    <a href="{% url 'catalogo:index' %}"
                       class="{% if request.resolver_match.namespace == 'catalogo' %}font-medium text-primary{% else %}text-muted-foreground hover:text-foreground{% endif %}"
                       {% if request.resolver_match.namespace == 'catalogo' %}aria-current="page"{% endif %}>
                        Jogos
                    </a>
                </li>
                <li><span class="text-muted-foreground">Guias</span></li>
                <li><span class="text-muted-foreground">Comunidade</span></li>
            </ul>
        </nav>
        <div>
            <button type="button" aria-label="Pesquisar" class="ml-2 inline-flex size-10 items-center justify-center rounded-md bg-secondary text-secondary-foreground">
                <svg aria-hidden="true" focusable="false" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg>
            </button>
            <button type="button" aria-label="Perfil" class="inline-flex size-10 items-center justify-center rounded-md bg-primary text-primary-foreground">
                <svg aria-hidden="true" focusable="false" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M5 21a7 7 0 0 1 14 0"></path>
                </svg>
            </button>
        </div>
    </div>
</header>
