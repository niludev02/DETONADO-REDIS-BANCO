<dialog id="modal-delete-account" aria-labelledby="modal-delete-account-title"
		class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-lg border border-border bg-card p-0 text-card-foreground shadow-xl backdrop:bg-black/60"
		{% if modal_aberto == "excluir_conta" %}data-open-on-load{% endif %}>
	<form method="post" action="{% url 'usuarios:seguranca_perfil' %}" class="p-6 sm:p-8">
		{% csrf_token %}
		<input type="hidden" name="acao" value="excluir_conta">
		<h2 id="modal-delete-account-title" class="text-xl font-semibold text-destructive">
			Excluir sua conta?
		</h2>
		<p class="mt-3 text-sm leading-6 text-muted-foreground">
			Esta ação é permanente. Seus dados de conta e sua foto de perfil serão removidos.
		</p>

		<div class="mt-6 space-y-4">
			<div>
				<label for="senha-exclusao" class="block text-sm font-medium">Senha atual</label>
				<input id="senha-exclusao" name="senha_atual" type="password" required
					   autocomplete="current-password"
					   class="mt-2 h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
			</div>
			<div>
				<label for="confirmacao-exclusao" class="block text-sm font-medium">
					Digite <span class="font-semibold">EXCLUIR</span> para confirmar
				</label>
				<input id="confirmacao-exclusao" name="confirmacao" type="text" required
					   autocomplete="off" spellcheck="false"
					   class="mt-2 h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
			</div>
		</div>
		{% if modal_aberto == "excluir_conta" and modal_erro %}
			<p class="mt-3 text-sm text-destructive" role="alert">{{ modal_erro }}</p>
		{% endif %}

		<div class="mt-7 flex flex-wrap justify-end gap-3">
			<button type="button" data-close-modal
					class="rounded-md border border-border px-4 py-2 text-sm font-medium hover:bg-secondary">
				Cancelar
			</button>
			<button type="submit"
					class="rounded-md bg-destructive px-4 py-2 text-sm font-medium text-destructive-foreground hover:bg-destructive/90">
				Excluir conta
			</button>
		</div>
	</form>
</dialog>
