<dialog id="modal-edit-password" aria-labelledby="modal-edit-password-title"
		class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-lg border border-border bg-card p-0 text-card-foreground shadow-xl backdrop:bg-black/60"
		{% if modal_aberto == "editar_senha" %}data-open-on-load{% endif %}>
	<form method="post" action="{% url 'usuarios:seguranca_perfil' %}" class="p-6 sm:p-8">
		{% csrf_token %}
		<input type="hidden" name="acao" value="editar_senha">
		<h2 id="modal-edit-password-title" class="text-xl font-semibold">Alterar senha</h2>
		<p class="mt-2 text-sm leading-6 text-muted-foreground">
			Confirme sua senha atual e escolha uma nova com pelo menos 8 caracteres.
		</p>

		<div class="mt-6 space-y-4">
			<div>
				<label for="senha-atual" class="block text-sm font-medium">Senha atual</label>
				<input id="senha-atual" name="senha_atual" type="password" required
					   autocomplete="current-password"
					   class="mt-2 h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
			</div>
			<div>
				<label for="nova-senha" class="block text-sm font-medium">Nova senha</label>
				<input id="nova-senha" name="nova_senha" type="password" required minlength="8"
					   autocomplete="new-password"
					   class="mt-2 h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
			</div>
			<div>
				<label for="confirmar-nova-senha" class="block text-sm font-medium">Confirmar nova senha</label>
				<input id="confirmar-nova-senha" name="confirmar_senha" type="password" required minlength="8"
					   autocomplete="new-password"
					   class="mt-2 h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
			</div>
		</div>
		{% if modal_aberto == "editar_senha" and modal_erro %}
			<p class="mt-3 text-sm text-destructive" role="alert">{{ modal_erro }}</p>
		{% endif %}

		<div class="mt-7 flex flex-wrap justify-end gap-3">
			<button type="button" data-close-modal
					class="rounded-md border border-border px-4 py-2 text-sm font-medium hover:bg-secondary">
				Cancelar
			</button>
			<button type="submit"
					class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">
				Atualizar senha
			</button>
		</div>
	</form>
</dialog>
