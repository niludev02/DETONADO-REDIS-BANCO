{% load static %}
<header class="border-b border-border">
    <div class="mx-auto flex max-w-4xl items-center justify-between p-6">
        <a href="{% url 'home' %}" aria-label="Detonado — início">
            <img src="{% static 'img/logo.jpeg' %}" alt="Detonado" class="h-7 w-auto">
        </a>
        <nav aria-label="Navegação principal">
            <ul class="flex gap-4">
                <li>
                    <a href="{% url 'home' %}"
                       class="{% if request.resolver_match.url_name == 'home' %}font-medium text-primary{% else %}text-muted-foreground hover:text-foreground{% endif %}"
                       {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
                        Início
                    </a>
                </li>
                <li>
                    <a href="{% url 'catalogo:index' %}"
                       class="{% if request.resolver_match.namespace == 'catalogo' %}font-medium text-primary{% else %}text-muted-foreground hover:text-foreground{% endif %}"
                       {% if request.resolver_match.namespace == 'catalogo' %}aria-current="page"{% endif %}>
                        Jogos
                    </a>
                </li>
                <li><span class="text-muted-foreground">Guias</span></li>
                <li><span class="text-muted-foreground">Comunidade</span></li>
            </ul>
        </nav>
        <div>
            <button type="button" aria-label="Pesquisar" class="ml-2 rounded-md bg-secondary px-4 py-2 text-secondary-foreground">
                <i class="fas fa-search"></i>
            </button>
            <button type="button" aria-label="Perfil" class="rounded-md bg-primary px-4 py-2 text-primary-foreground">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </div>
</header>
